name: Capture design review
on:
  push:
    branches: ['design/autumn-arcade']
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TURKEY_SCREENSHOT_DIR: test-results
          TURKEY_REVIEW_SHOTS: '1'
      - name: Publish rendered review images to an isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f test-results/01-lobby.jpg test-results/02-playing.jpg test-results/05-scanner-mobile.jpg test-results/06-fullscreen-hunt.jpg
          git commit -m 'Capture rendered Turkey Hunt screens [skip ci]'
          git push origin HEAD:refs/heads/review/autumn-arcade-${{ github.run_id }}
